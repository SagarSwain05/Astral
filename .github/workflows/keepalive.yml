# Keeps the Render free-tier API awake so visitors never hit a cold start
# and the server's own NASA sync cron jobs keep running.
name: API keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 \
            "${{ vars.API_URL || 'https://astral-api-kwt0.onrender.com' }}/health"
